name: Android

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'APK نهایی بساز و GitHub Release منتشر کن'
        type: boolean
        default: false
      tag:
        description: 'برچسب نسخه (مثلاً v1.0)'
        type: string
        default: 'v1.0'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Unit tests
        run: ./gradlew :domain:test --stacktrace
      - name: App unit tests (Room, Robolectric)
        run: ./gradlew :app:testDebugUnitTest --stacktrace
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Verify stable signing key
        run: .github/scripts/verify-signature.sh "$(ls app/build/outputs/apk/debug/*.apk | head -1)"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: board-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            domain/build/reports/tests
            app/build/reports/tests

  # APK نهایی: فقط با برچسب v* یا اجرای دستی با release=true؛ هیچ‌وقت خودکار با push معمولی.
  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace
      - name: Verify stable signing key
        run: .github/scripts/verify-signature.sh "$(ls app/build/outputs/apk/release/*.apk | head -1)"
      - name: Name the APK
        id: meta
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          cp "$(ls app/build/outputs/apk/release/*.apk | head -1)" "board-${VERSION}.apk"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "file=board-${VERSION}.apk" >> "$GITHUB_OUTPUT"
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: board-release-apk
          path: ${{ steps.meta.outputs.file }}
          if-no-files-found: error
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.meta.outputs.tag }}" "${{ steps.meta.outputs.file }}" \
            --target "${{ github.sha }}" \
            --title "دفتر ${{ steps.meta.outputs.tag }}" \
            --notes "نسخهٔ مستقل و محلی «داشبورد دفتر» برای اندروید. راهنمای نصب: README_FA.md. اگر هنگام به‌روزرسانی «App not installed» دیدید، نسخهٔ قدیمی را یک‌بار پاک کنید (اول پشتیبان بگیرید)."
