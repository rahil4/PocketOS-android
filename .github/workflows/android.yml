name: Android

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Unit tests
        run: ./gradlew :domain:test --stacktrace
      - name: App unit tests (Room, Robolectric)
        run: ./gradlew :app:testDebugUnitTest --stacktrace
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Verify stable signing key
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          EXPECTED=$(keytool -list -keystore app/board-debug.keystore -storepass android 2>/dev/null | grep 'SHA-256' | sed 's/.*: //')
          ACTUAL=$(keytool -printcert -jarfile "$APK" 2>/dev/null | grep 'SHA256' | sed 's/.*: //')
          echo "expected=$EXPECTED"
          echo "actual=$ACTUAL"
          test -n "$EXPECTED" && test "$EXPECTED" = "$ACTUAL"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: board-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            domain/build/reports/tests
            app/build/reports/tests
